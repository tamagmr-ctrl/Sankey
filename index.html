<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>サンキー図ビルダー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0F1416;
    --panel: #161C1F;
    --panel-2: #1C2327;
    --border: #2A3336;
    --text: #ECF0F1;
    --text-dim: #8B979C;
    --text-faint: #5C666A;
    --accent: #E8A33D;
    --accent-ink: #1A1300;
    --accent-dim: rgba(232,163,61,0.16);
    --danger: #D96C6C;
    --radius: 7px;
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Grotesk', sans-serif;
    min-height: 100vh;
  }
  .app{ display:flex; flex-direction:column; min-height:100vh; }

  header{
    padding: 20px 28px 16px;
    border-bottom: 1px solid var(--border);
    display:flex; align-items:baseline; justify-content:space-between; gap:16px; flex-wrap:wrap;
  }
  header h1{ font-size: 20px; font-weight:700; margin:0; letter-spacing:0.01em; }
  header p{ margin:4px 0 0; color:var(--text-dim); font-size:13px; }
  #storage-mode{ font-size:10.5px; color:var(--text-faint); font-family:'IBM Plex Mono', monospace; }

  .layout{ display:flex; flex:1; min-height:0; }
  @media (max-width: 900px){ .layout{ flex-direction:column; } }

  .sidebar{
    width: 380px; min-width:300px; flex-shrink:0;
    border-right: 1px solid var(--border);
    overflow-y:auto;
    padding: 18px;
    display:flex; flex-direction:column; gap:20px;
  }
  @media (max-width: 900px){ .sidebar{ width:100%; border-right:none; border-bottom:1px solid var(--border); } }

  .panel{
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
  }
  .panel h2{
    font-size: 12px; text-transform:none; letter-spacing:0.03em;
    color: var(--text-dim); margin:0 0 10px; font-weight:600;
    display:flex; align-items:center; justify-content:space-between;
  }
  .panel h2 .hint{ font-weight:400; color:var(--text-faint); font-size:11px; }

  .row{ display:flex; gap:8px; margin-bottom:8px; }
  .row > *{ flex:1; min-width:0; }

  input[type=text], input[type=number], select{
    width:100%;
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: var(--radius);
    padding: 8px 10px;
    font-family: inherit;
    font-size: 13px;
  }
  input[type=number]{ font-family:'IBM Plex Mono', monospace; }
  input::placeholder{ color: var(--text-faint); }
  input:focus, select:focus{ outline:none; border-color: var(--accent); }

  button{
    font-family: inherit;
    font-size: 13px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--text);
    padding: 8px 12px;
    cursor: pointer;
    white-space: nowrap;
  }
  button:hover{ border-color: var(--text-faint); }
  button.primary{ background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight:600; }
  .theme-select{ min-width: 220px; }
  button.primary:hover{ filter:brightness(1.08); }
  button.ghost{ background:transparent; }
  button.small{ padding:3px 7px; font-size:11px; }
  button.icon{ padding:3px 6px; font-size:11px; line-height:1; }
  button.danger-ghost{ color: var(--danger); border-color: transparent; background:transparent; }
  button.danger-ghost:hover{ background: rgba(217,108,108,0.1); }
  button:disabled{ opacity:0.3; cursor:default; }
  button:disabled:hover{ border-color: var(--border); }

  .list{ display:flex; flex-direction:column; gap:6px; margin-top:10px; max-height:260px; overflow-y:auto; }
  .item{
    display:flex; align-items:center; gap:6px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 6px 8px;
    font-size: 12.5px;
  }
  .swatch{ width:10px; height:10px; border-radius:50%; flex-shrink:0; }
  .item .label{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; cursor:pointer; }
  .item .label:hover{ color: var(--accent); }
  .item .val{ color: var(--text-dim); font-family:'IBM Plex Mono', monospace; font-size:11.5px; }
  .item .order-btns{ display:flex; flex-direction:column; gap:1px; }
  .item .order-btns button{ padding:0 5px; font-size:9px; line-height:1.4; }
  .item .edit-value{ width:64px; flex:none; padding:5px 6px; font-size:12px; text-align:right; }
  .empty-note{ color: var(--text-faint); font-size:12px; padding: 6px 2px; }

  .edit-row{ display:flex; gap:6px; flex:1; min-width:0; }
  .edit-row input{ padding:5px 7px; font-size:12px; }

  main.canvas-wrap{
    flex:1; position:relative; min-height: 420px;
    display:flex; align-items:center; justify-content:center;
  }
  svg#sankey-svg{ width:100%; height:100%; display:block; }
  #empty-state{
    position:absolute; text-align:center; color: var(--text-dim); max-width:320px; padding: 20px;
  }
  #empty-state h3{ color: var(--text); font-size:15px; margin:0 0 8px; }
  #empty-state p{ font-size:13px; line-height:1.6; margin:0 0 14px; }

  footer.save-bar{
    border-top: 1px solid var(--border);
    padding: 12px 20px;
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  }
  footer.save-bar input{ max-width:220px; }
  .saved-panel{
    position:fixed; bottom: 64px; left:50%; transform:translateX(-50%);
    background: var(--panel); border:1px solid var(--border); border-radius: var(--radius);
    width: 360px; max-width:90vw; max-height: 50vh; overflow-y:auto;
    padding:12px; box-shadow: 0 12px 32px rgba(0,0,0,0.4);
    display:none; z-index:20;
  }
  .saved-panel.open{ display:block; }
  .saved-panel h3{ margin:0 0 8px; font-size:12px; color:var(--text-dim); font-weight:600; }
  .saved-item{
    display:flex; align-items:center; gap:8px; padding:7px 4px;
    border-bottom: 1px solid var(--border);
  }
  .saved-item:last-child{ border-bottom:none; }
  .saved-item .meta{ flex:1; min-width:0; }
  .saved-item .meta .name{ font-size:13px; }
  .saved-item .meta .date{ font-size:10.5px; color:var(--text-faint); font-family:'IBM Plex Mono', monospace; }

  #toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(10px);
    background: var(--panel-2); border:1px solid var(--border); color: var(--text);
    padding: 9px 16px; border-radius: var(--radius); font-size:13px;
    opacity:0; pointer-events:none; transition: opacity 0.25s, transform 0.25s;
    z-index: 50; max-width: 80vw; text-align:center;
  }
  #toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  .tips{ font-size:12px; color:var(--text-dim); line-height:1.7; }
  .tips b{ color:var(--text); }

  select option{ background: var(--panel-2); }

  .color-picker-row{ align-items:center; flex-wrap:wrap; gap:6px; margin-bottom:0; }
  .color-picker-label{ font-size:11.5px; color:var(--text-dim); flex:none; }
  .palette-swatches{ display:flex; flex-wrap:wrap; gap:5px; flex:none; }
  .palette-swatch{
    width:18px; height:18px; border-radius:50%; cursor:pointer;
    border:2px solid transparent; box-shadow: 0 0 0 1px var(--border);
    flex:none; padding:0;
  }
  .palette-swatch:hover{ transform: scale(1.12); }
  .palette-swatch.selected{ border-color: var(--text); box-shadow: 0 0 0 1px var(--text); }
  .color-custom-input{
    width:26px; height:24px; padding:0; border:1px solid var(--border); border-radius:4px;
    background:none; flex:none; cursor:pointer;
  }
  .color-custom-input.selected{ box-shadow: 0 0 0 2px var(--text); border-radius:6px; }
</style>
</head>
<body>
<div class="app">

  <header>
    <div>
      <h1>サンキー図ビルダー</h1>
      <p>ノードとリンクを追加して、その場でサンキー図を描画・保存できます</p>
    </div>
    <div style="display:flex; flex-direction:column; align-items:flex-end; gap:6px;">
      <div class="row" style="margin:0; flex:none; gap:8px;">
        <select id="theme-select" class="theme-select"></select>
        <button class="ghost" id="btn-sample">サンプルを読み込む</button>
        <button class="ghost" id="btn-export">JSONを書き出す</button>
      </div>
      <span id="storage-mode"></span>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar">

      <div class="panel">
        <h2>ノードを追加 <span class="hint">名前 / カテゴリ・クリックで編集</span></h2>
        <div class="row">
          <input type="text" id="node-name" placeholder="ノード名 (例: 売上)">
        </div>
        <div class="row">
          <input type="text" id="node-category" list="category-list" placeholder="カテゴリ (任意・色分け用)">
          <button class="primary" id="btn-add-node" style="flex:none;">追加</button>
        </div>
        <div class="row color-picker-row">
          <span class="color-picker-label">色:</span>
          <div class="palette-swatches" id="node-palette-swatches"></div>
          <input type="color" id="node-color-custom" class="color-custom-input" value="#4FB6A8" title="カスタムカラー">
          <button type="button" class="small ghost" id="node-color-auto">自動</button>
        </div>
        <datalist id="category-list"></datalist>
        <div class="list" id="node-list"></div>
      </div>

      <div class="panel">
        <h2>リンクを追加 <span class="hint">値は直接編集・✎で起点/終点を変更</span></h2>
        <div class="row">
          <select id="link-source"></select>
          <select id="link-target"></select>
        </div>
        <div class="row">
          <input type="number" id="link-value" placeholder="数値" min="0" step="any">
          <button class="primary" id="btn-add-link" style="flex:none;">追加</button>
        </div>
        <div class="row" style="margin-bottom:0;">
          <label style="font-size:12px; color:var(--text-dim); display:flex; align-items:center; gap:6px;">
            リンクの色:
            <select id="color-mode" style="width:auto;">
              <option value="source">起点ノード基準</option>
              <option value="target">終点ノード基準</option>
            </select>
          </label>
        </div>
        <div class="list" id="link-list"></div>
      </div>

      <div class="panel tips">
        <h2>作図のコツ</h2>
        <b>1.</b> Source / Target / 値を整理してから入力する<br>
        <b>2.</b> 要素を増やしすぎない。細かい値は「その他」にまとめる<br>
        <b>3.</b> カテゴリごとに色分けすると直感的に伝わる
      </div>

    </aside>

    <main class="canvas-wrap">
      <svg id="sankey-svg"></svg>
      <div id="empty-state">
        <h3>まだ何もありません</h3>
        <p>左のパネルからノードとリンクを追加すると、ここにサンキー図が描かれます。</p>
        <button class="primary" id="btn-sample-2">サンプルを読み込む</button>
      </div>
    </main>
  </div>

  <footer class="save-bar">
    <input type="text" id="save-name" placeholder="保存名を入力">
    <button class="primary" id="btn-save">名前を付けて保存</button>
    <button class="ghost" id="btn-open-saved">保存済みを開く</button>
    <button class="ghost" id="btn-clear">すべてクリア</button>
    <span style="flex:1"></span>
    <span style="color:var(--text-faint); font-size:11.5px;">変更は自動的に保持されます</span>
  </footer>

</div>

<div class="saved-panel" id="saved-panel">
  <h3>保存済みの図</h3>
  <div id="saved-list"></div>
</div>

<div id="toast"></div>

<script>
// ---------- Storage backend (Claude artifact storage, with localStorage fallback) ----------
const hasClaudeStorage = (typeof window.storage !== 'undefined') && window.storage && typeof window.storage.get === 'function';

const localStorageBackend = {
  async get(key){
    let raw;
    try{ raw = localStorage.getItem('sankeyapp:' + key); }catch(e){ throw e; }
    if(raw === null) throw new Error('not found');
    return { key, value: raw };
  },
  async set(key, value){
    localStorage.setItem('sankeyapp:' + key, value);
    return { key, value };
  },
  async delete(key){
    localStorage.removeItem('sankeyapp:' + key);
    return { key, deleted: true };
  },
  async list(prefix){
    const keys = [];
    for(let i = 0; i < localStorage.length; i++){
      const k = localStorage.key(i);
      if(k && k.startsWith('sankeyapp:')){
        const stripped = k.slice('sankeyapp:'.length);
        if(!prefix || stripped.startsWith(prefix)) keys.push(stripped);
      }
    }
    return { keys };
  }
};

let storageAvailable = true;
const store = {
  async get(key){ return hasClaudeStorage ? window.storage.get(key, false) : localStorageBackend.get(key); },
  async set(key, value){ return hasClaudeStorage ? window.storage.set(key, value, false) : localStorageBackend.set(key, value); },
  async delete(key){ return hasClaudeStorage ? window.storage.delete(key, false) : localStorageBackend.delete(key); },
  async list(prefix){ return hasClaudeStorage ? window.storage.list(prefix, false) : localStorageBackend.list(prefix); }
};

// quick availability check (e.g. localStorage disabled in private mode)
try{
  localStorage.setItem('sankeyapp:__test__', '1');
  localStorage.removeItem('sankeyapp:__test__');
}catch(e){
  if(!hasClaudeStorage) storageAvailable = false;
}

// ---------- State ----------
let nodes = [];   // {id, name, category}
let links = [];   // {id, source, target, value}
let categoryColors = {};
let nextColorIndex = 0;
let colorMode = 'source';
let idCounter = 0;
let editingNodeId = null;
let editingLinkId = null;
let pendingNodeColor = null;
let editingNodeColor = null;
let currentThemeId = 'dark';

const PALETTE = ['#4FB6A8','#E8A33D','#D96C6C','#7C9CDE','#B98CD9','#8FBF6B','#E3C567','#5FA8D3','#DE8F68','#6FBF9E','#C98BC7','#9AC46B'];

// ---------- Design themes (for presentation-ready color schemes) ----------
const THEMES = {
  dark: {
    label: 'デフォルト (ダーク)',
    vars: { bg:'#0F1416', panel:'#161C1F', panel2:'#1C2327', border:'#2A3336', text:'#ECF0F1', textDim:'#8B979C', textFaint:'#5C666A', accent:'#E8A33D', accentInk:'#1A1300' },
    palette: ['#4FB6A8','#E8A33D','#D96C6C','#7C9CDE','#B98CD9','#8FBF6B','#E3C567','#5FA8D3','#DE8F68','#6FBF9E','#C98BC7','#9AC46B']
  },
  bcg: {
    label: 'BCG系 (白 × 深緑)',
    vars: { bg:'#FFFFFF', panel:'#F5F8F6', panel2:'#FFFFFF', border:'#D9E2DC', text:'#14261F', textDim:'#57685F', textFaint:'#8FA098', accent:'#0B4F3A', accentInk:'#FFFFFF' },
    palette: ['#0B4F3A','#17805C','#2FA684','#57C9A5','#8FE0C3','#0F6B4C','#3FA980','#0B3D2E']
  },
  mizuho: {
    label: 'みずほ系 (紺 × 赤)',
    vars: { bg:'#FFFFFF', panel:'#F4F6FA', panel2:'#FFFFFF', border:'#D7DEEA', text:'#0B2D5B', textDim:'#4F5F78', textFaint:'#8996AC', accent:'#C8102E', accentInk:'#FFFFFF' },
    palette: ['#0B2D5B','#1D4A85','#3E6FB0','#7FA3D1','#C8102E','#8C0E22','#4C6FA0','#0B2D5B']
  },
  mufg: {
    label: '三菱UFJ系 (レッド × 生成り)',
    vars: { bg:'#FAF7F2', panel:'#FFFFFF', panel2:'#FFFFFF', border:'#E8DFD3', text:'#231F20', textDim:'#6B6560', textFaint:'#A39C93', accent:'#D71920', accentInk:'#FFFFFF' },
    palette: ['#D71920','#A30F17','#EF5350','#F5A3A3','#4A4A4A','#8C8C8C','#231F20','#D71920']
  },
  goldman: {
    label: 'ゴールドマン・サックス系 (ネイビー × スティールブルー)',
    vars: { bg:'#FFFFFF', panel:'#F5F6F8', panel2:'#FFFFFF', border:'#DCE1E8', text:'#12233F', textDim:'#5C697C', textFaint:'#96A2B2', accent:'#6B96C3', accentInk:'#12233F' },
    palette: ['#12233F','#2C4870','#6B96C3','#A9C2DD','#4A6FA1','#1B3358','#8AA9C9']
  },
  tel: {
    label: '東京エレクトロン系 (ブルー × グリーン)',
    vars: { bg:'#F7FAFF', panel:'#EFF5FE', panel2:'#FFFFFF', border:'#D7E6FB', text:'#0F2A4A', textDim:'#4C6178', textFaint:'#8DA0B5', accent:'#1A73E8', accentInk:'#FFFFFF' },
    palette: ['#1A73E8','#0B57C7','#7ED957','#3DDC97','#57C2E8','#0F9D58']
  },
  digital: {
    label: 'デジタル庁風 (白 × ブルー / 行政サービス系)',
    vars: { bg:'#FFFFFF', panel:'#F7F9FB', panel2:'#FFFFFF', border:'#D9E1EA', text:'#1A1A1A', textDim:'#5C6570', textFaint:'#98A0AA', accent:'#0017C1', accentInk:'#FFFFFF' },
    palette: ['#0017C1','#3D5AFE','#7C93FF','#00A0E9','#4A4A4A','#8C8C8C']
  },
  mac: {
    label: 'Mac風 (System UI)',
    vars: { bg:'#F5F5F7', panel:'#FFFFFF', panel2:'#FFFFFF', border:'#E5E5EA', text:'#1D1D1F', textDim:'#6E6E73', textFaint:'#AEAEB2', accent:'#007AFF', accentInk:'#FFFFFF' },
    palette: ['#007AFF','#34C759','#FF9500','#FF3B30','#AF52DE','#5AC8FA','#FF2D55','#FFCC00']
  },
  markmap: {
    label: 'markmap風 (マインドマップ配色)',
    vars: { bg:'#FFFFFF', panel:'#FAFAFA', panel2:'#FFFFFF', border:'#E0E0E0', text:'#222222', textDim:'#666666', textFaint:'#999999', accent:'#1F77B4', accentInk:'#FFFFFF' },
    palette: ['#1F77B4','#FF7F0E','#2CA02C','#D62728','#9467BD','#8C564B','#E377C2','#7F7F7F','#BCBD22','#17BECF']
  }
};

function applyThemeVars(id){
  const theme = THEMES[id] || THEMES.dark;
  currentThemeId = THEMES[id] ? id : 'dark';
  const root = document.documentElement.style;
  root.setProperty('--bg', theme.vars.bg);
  root.setProperty('--panel', theme.vars.panel);
  root.setProperty('--panel-2', theme.vars.panel2);
  root.setProperty('--border', theme.vars.border);
  root.setProperty('--text', theme.vars.text);
  root.setProperty('--text-dim', theme.vars.textDim);
  root.setProperty('--text-faint', theme.vars.textFaint);
  root.setProperty('--accent', theme.vars.accent);
  root.setProperty('--accent-ink', theme.vars.accentInk);
  PALETTE.length = 0;
  PALETTE.push(...theme.palette);
  const sel = document.getElementById('theme-select');
  if(sel) sel.value = currentThemeId;
}

function switchTheme(id){
  applyThemeVars(id);
  // re-assign auto (non-custom) node/category colors from the new theme's palette
  categoryColors = {};
  nextColorIndex = 0;
  refreshAll();
  renderAddNodeSwatches();
  autosave();
  showToast(THEMES[currentThemeId].label + ' に切り替えました');
}

function populateThemeSelect(){
  const sel = document.getElementById('theme-select');
  sel.innerHTML = Object.keys(THEMES).map(id => `<option value="${id}">${escapeHtml(THEMES[id].label)}</option>`).join('');
}

function uid(prefix){ idCounter++; return prefix + '_' + Date.now().toString(36) + '_' + idCounter; }

function getColor(key){
  if(!categoryColors[key]){
    categoryColors[key] = PALETTE[nextColorIndex % PALETTE.length];
    nextColorIndex++;
  }
  return categoryColors[key];
}
function nodeColor(node){
  if(!node) return '#888';
  if(node.color) return node.color;
  const key = (node.category && node.category.trim()) ? 'cat:' + node.category.trim() : 'node:' + node.id;
  return getColor(key);
}
function nodeById(id){ return nodes.find(n => n.id === id); }
function formatNum(v){
  if(v === undefined || v === null || isNaN(v)) return '';
  if(Number.isInteger(v)) return String(v);
  return (Math.round(v * 100) / 100).toString();
}

// ---------- Color palette picker (used by add-node form and node edit rows) ----------
function renderSwatchesInto(container, selectedColor, customInput, onSelect){
  container.innerHTML = '';
  PALETTE.forEach(c => {
    const sw = document.createElement('button');
    sw.type = 'button';
    sw.className = 'palette-swatch' + (selectedColor && selectedColor.toLowerCase() === c.toLowerCase() ? ' selected' : '');
    sw.style.background = c;
    sw.title = c;
    sw.addEventListener('click', () => onSelect(c));
    container.appendChild(sw);
  });
  if(customInput){
    const isCustom = selectedColor && !PALETTE.some(c => c.toLowerCase() === selectedColor.toLowerCase());
    customInput.classList.toggle('selected', !!isCustom);
    if(selectedColor) customInput.value = selectedColor;
  }
}
function renderAddNodeSwatches(){
  const container = document.getElementById('node-palette-swatches');
  const customInput = document.getElementById('node-color-custom');
  if(!container) return;
  renderSwatchesInto(container, pendingNodeColor, customInput, c => {
    pendingNodeColor = c;
    renderAddNodeSwatches();
  });
}

// ---------- Toast ----------
let toastTimer = null;
function showToast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
}

// ---------- Storage ops ----------
async function autosave(){
  try{
    await store.set('sankey:current', JSON.stringify({ nodes, links, categoryColors, nextColorIndex, colorMode, themeId: currentThemeId }));
  }catch(e){ console.error('autosave failed', e); }
}

async function init(){
  populateThemeSelect();
  document.getElementById('theme-select').addEventListener('change', e => switchTheme(e.target.value));

  document.getElementById('storage-mode').textContent = hasClaudeStorage
    ? '保存先: Claudeストレージ'
    : (storageAvailable ? '保存先: このブラウザ (localStorage)' : '保存先: 利用不可 (プライベートモードの可能性)');
  let themeId = 'dark';
  try{
    const cur = await store.get('sankey:current');
    if(cur && cur.value){
      const data = JSON.parse(cur.value);
      nodes = data.nodes || [];
      links = data.links || [];
      categoryColors = data.categoryColors || {};
      nextColorIndex = data.nextColorIndex || 0;
      colorMode = data.colorMode || 'source';
      themeId = data.themeId || 'dark';
    }
  }catch(e){ /* no autosave yet, start empty */ }
  applyThemeVars(themeId);
  document.getElementById('color-mode').value = colorMode;
  renderAddNodeSwatches();
  refreshAll();
}

async function saveDiagram(name){
  name = name.trim();
  if(!name){ showToast('保存名を入力してください'); return; }
  try{
    await store.set('sankey:diagram:' + name, JSON.stringify({
      nodes, links, categoryColors, nextColorIndex, colorMode, themeId: currentThemeId, savedAt: new Date().toISOString()
    }));
    showToast('「' + name + '」として保存しました');
    document.getElementById('save-name').value = '';
    refreshSavedList();
  }catch(e){ showToast('保存に失敗しました: ' + e.message); console.error(e); }
}

async function refreshSavedList(){
  const listEl = document.getElementById('saved-list');
  try{
    const res = await store.list('sankey:diagram:');
    const keys = (res && res.keys) ? res.keys : [];
    if(keys.length === 0){
      listEl.innerHTML = '<div class="empty-note">保存された図はまだありません</div>';
      return;
    }
    listEl.innerHTML = '';
    for(const key of keys){
      const name = key.replace('sankey:diagram:', '');
      const row = document.createElement('div');
      row.className = 'saved-item';
      row.innerHTML = `
        <div class="meta">
          <div class="name">${escapeHtml(name)}</div>
          <div class="date" data-date-key="${cssEscape(key)}"></div>
        </div>
        <button class="small" data-load="${escapeHtml(key)}">読込</button>
        <button class="small danger-ghost" data-del="${escapeHtml(key)}">削除</button>
      `;
      listEl.appendChild(row);
    }
    listEl.querySelectorAll('[data-load]').forEach(b => b.addEventListener('click', () => loadDiagram(b.dataset.load)));
    listEl.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', () => deleteDiagram(b.dataset.del)));
    for(const key of keys){
      store.get(key).then(res => {
        if(!res) return;
        try{
          const data = JSON.parse(res.value);
          const el = listEl.querySelector(`[data-date-key="${cssEscape(key)}"]`);
          if(el && data.savedAt) el.textContent = new Date(data.savedAt).toLocaleString('ja-JP');
        }catch(e){}
      }).catch(()=>{});
    }
  }catch(e){
    listEl.innerHTML = '<div class="empty-note">読み込みに失敗しました</div>';
  }
}
function cssEscape(s){ return s.replace(/[^a-zA-Z0-9_\-]/g, '_'); }

async function loadDiagram(key){
  try{
    const res = await store.get(key);
    if(!res){ showToast('見つかりませんでした'); return; }
    const data = JSON.parse(res.value);
    nodes = data.nodes || [];
    links = data.links || [];
    categoryColors = data.categoryColors || {};
    nextColorIndex = data.nextColorIndex || 0;
    colorMode = data.colorMode || 'source';
    applyThemeVars(data.themeId || 'dark');
    document.getElementById('color-mode').value = colorMode;
    renderAddNodeSwatches();
    refreshAll();
    autosave();
    showToast('読み込みました: ' + key.replace('sankey:diagram:', ''));
    document.getElementById('saved-panel').classList.remove('open');
  }catch(e){ showToast('読み込みに失敗しました'); console.error(e); }
}

async function deleteDiagram(key){
  try{
    await store.delete(key);
    showToast('削除しました');
    refreshSavedList();
  }catch(e){ showToast('削除に失敗しました'); }
}

// ---------- Node / Link operations ----------
function addNode(name, category, color){
  name = name.trim();
  if(!name){ showToast('ノード名を入力してください'); return; }
  if(nodes.some(n => n.name === name)){ showToast('同じ名前のノードがすでにあります'); return; }
  nodes.push({ id: uid('n'), name, category: category.trim(), color: color || null });
  document.getElementById('node-name').value = '';
  document.getElementById('node-category').value = '';
  pendingNodeColor = null;
  renderAddNodeSwatches();
  refreshAll(); autosave();
}
function deleteNode(id){
  nodes = nodes.filter(n => n.id !== id);
  links = links.filter(l => l.source !== id && l.target !== id);
  if(editingNodeId === id) editingNodeId = null;
  refreshAll(); autosave();
}
function updateNode(id, name, category, color){
  name = name.trim();
  if(!name){ showToast('ノード名は空にできません'); return; }
  if(nodes.some(n => n.id !== id && n.name === name)){ showToast('同じ名前のノードがすでにあります'); return; }
  const n = nodeById(id);
  if(!n) return;
  n.name = name;
  n.category = category.trim();
  n.color = color || null;
  editingNodeId = null;
  refreshAll(); autosave();
}
function moveNode(id, dir){
  const i = nodes.findIndex(n => n.id === id);
  const j = i + dir;
  if(i < 0 || j < 0 || j >= nodes.length) return;
  [nodes[i], nodes[j]] = [nodes[j], nodes[i]];
  refreshAll(); autosave();
}

function addLink(sourceId, targetId, value){
  if(!sourceId || !targetId){ showToast('ノードを選択してください'); return; }
  if(sourceId === targetId){ showToast('起点と終点に同じノードは選べません'); return; }
  value = parseFloat(value);
  if(!(value > 0)){ showToast('0より大きい数値を入力してください'); return; }
  links.push({ id: uid('l'), source: sourceId, target: targetId, value });
  document.getElementById('link-value').value = '';
  refreshAll(); autosave();
}
function deleteLink(id){
  links = links.filter(l => l.id !== id);
  if(editingLinkId === id) editingLinkId = null;
  refreshAll(); autosave();
}
function updateLinkValue(id, value, input){
  value = parseFloat(value);
  const l = links.find(x => x.id === id);
  if(!l) return;
  if(!(value > 0)){
    showToast('0より大きい数値を入力してください');
    if(input) input.value = l.value; // revert visible input to last valid value
    return;
  }
  l.value = value;
  drawSankey();
  renderLinkList();
  autosave();
}
function updateLinkSourceTarget(id, sourceId, targetId){
  if(!sourceId || !targetId){ showToast('ノードを選択してください'); return; }
  if(sourceId === targetId){ showToast('起点と終点に同じノードは選べません'); return; }
  const l = links.find(x => x.id === id);
  if(!l) return;
  l.source = sourceId;
  l.target = targetId;
  editingLinkId = null;
  refreshAll(); autosave();
}
function moveLink(id, dir){
  const i = links.findIndex(l => l.id === id);
  const j = i + dir;
  if(i < 0 || j < 0 || j >= links.length) return;
  [links[i], links[j]] = [links[j], links[i]];
  refreshAll(); autosave();
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ---------- UI refresh ----------
function refreshAll(){
  renderNodeList();
  renderLinkList();
  renderNodeSelects();
  renderCategoryList();
  drawSankey();
}

function renderNodeList(){
  const el = document.getElementById('node-list');
  if(nodes.length === 0){ el.innerHTML = '<div class="empty-note">ノードがありません</div>'; return; }
  el.innerHTML = '';
  nodes.forEach((n, i) => {
    const div = document.createElement('div');
    div.className = 'item';
    if(editingNodeId === n.id){
      div.innerHTML = `
        <div style="display:flex; flex-direction:column; gap:6px; flex:1; min-width:0;">
          <div class="edit-row">
            <input type="text" class="edit-name" value="${escapeHtml(n.name)}">
            <input type="text" class="edit-category" list="category-list" value="${escapeHtml(n.category || '')}" placeholder="カテゴリ">
          </div>
          <div class="row color-picker-row">
            <span class="color-picker-label">色:</span>
            <div class="palette-swatches" id="edit-palette-${n.id}"></div>
            <input type="color" class="color-custom-input edit-color-custom" value="${n.color || '#4FB6A8'}" title="カスタムカラー">
            <button type="button" class="small ghost" data-color-auto="${n.id}">自動</button>
          </div>
        </div>
        <div style="display:flex; flex-direction:column; gap:4px; flex:none;">
          <button class="small primary" data-save-node="${n.id}">✓</button>
          <button class="small ghost" data-cancel-node="${n.id}">✕</button>
        </div>
      `;
    } else {
      div.innerHTML = `
        <span class="swatch" style="background:${nodeColor(n)}"></span>
        <span class="label" data-edit-node="${n.id}">${escapeHtml(n.name)}${n.category ? ' <span class="val">('+escapeHtml(n.category)+')</span>' : ''}</span>
        <div class="order-btns">
          <button class="icon" data-up-node="${n.id}" ${i === 0 ? 'disabled' : ''}>▲</button>
          <button class="icon" data-down-node="${n.id}" ${i === nodes.length - 1 ? 'disabled' : ''}>▼</button>
        </div>
        <button class="small danger-ghost" data-del-node="${n.id}">✕</button>
      `;
    }
    el.appendChild(div);

    if(editingNodeId === n.id){
      const swatchContainer = div.querySelector('.palette-swatches');
      const customInput = div.querySelector('.edit-color-custom');
      const renderEditSwatches = () => {
        renderSwatchesInto(swatchContainer, editingNodeColor, customInput, c => { editingNodeColor = c; renderEditSwatches(); });
      };
      renderEditSwatches();
      customInput.addEventListener('input', e => { editingNodeColor = e.target.value; renderEditSwatches(); });
      div.querySelector('[data-color-auto]').addEventListener('click', () => { editingNodeColor = null; renderEditSwatches(); });
    }
  });

  el.querySelectorAll('[data-edit-node]').forEach(elm => elm.addEventListener('click', () => {
    editingNodeId = elm.dataset.editNode;
    const n = nodeById(editingNodeId);
    editingNodeColor = (n && n.color) || null;
    renderNodeList();
  }));
  el.querySelectorAll('[data-up-node]').forEach(b => b.addEventListener('click', () => moveNode(b.dataset.upNode, -1)));
  el.querySelectorAll('[data-down-node]').forEach(b => b.addEventListener('click', () => moveNode(b.dataset.downNode, 1)));
  el.querySelectorAll('[data-del-node]').forEach(b => b.addEventListener('click', () => deleteNode(b.dataset.delNode)));
  el.querySelectorAll('[data-cancel-node]').forEach(b => b.addEventListener('click', () => { editingNodeId = null; editingNodeColor = null; renderNodeList(); }));
  el.querySelectorAll('[data-save-node]').forEach(b => {
    const wrap = b.closest('.item');
    const commit = () => {
      const nameInput = wrap.querySelector('.edit-name');
      const catInput = wrap.querySelector('.edit-category');
      updateNode(b.dataset.saveNode, nameInput.value, catInput.value, editingNodeColor);
    };
    b.addEventListener('click', commit);
    wrap.querySelectorAll('input[type=text]').forEach(inp => inp.addEventListener('keydown', e => { if(e.key === 'Enter') commit(); if(e.key === 'Escape'){ editingNodeId = null; editingNodeColor = null; renderNodeList(); } }));
  });
}

function renderLinkList(){
  const el = document.getElementById('link-list');
  if(links.length === 0){ el.innerHTML = '<div class="empty-note">リンクがありません</div>'; return; }
  el.innerHTML = '';
  links.forEach((l, i) => {
    const s = nodeById(l.source), t = nodeById(l.target);
    const div = document.createElement('div');
    div.className = 'item';
    if(editingLinkId === l.id){
      const opts = nodes.map(n => `<option value="${n.id}">${escapeHtml(n.name)}</option>`).join('');
      div.innerHTML = `
        <div class="edit-row">
          <select class="edit-source">${opts}</select>
          <select class="edit-target">${opts}</select>
        </div>
        <button class="small primary" data-save-link="${l.id}">✓</button>
        <button class="small ghost" data-cancel-link="${l.id}">✕</button>
      `;
      div.querySelector('.edit-source').value = l.source;
      div.querySelector('.edit-target').value = l.target;
    } else {
      div.innerHTML = `
        <span class="label" style="cursor:default;">${escapeHtml(s ? s.name : '?')} → ${escapeHtml(t ? t.name : '?')}</span>
        <input type="number" class="edit-value" min="0" step="any" value="${l.value}" data-value-for="${l.id}" title="値を編集">
        <div class="order-btns">
          <button class="icon" data-up-link="${l.id}" ${i === 0 ? 'disabled' : ''}>▲</button>
          <button class="icon" data-down-link="${l.id}" ${i === links.length - 1 ? 'disabled' : ''}>▼</button>
        </div>
        <button class="small ghost" data-edit-link="${l.id}" title="起点/終点を変更">✎</button>
        <button class="small danger-ghost" data-del-link="${l.id}">✕</button>
      `;
    }
    el.appendChild(div);
  });

  el.querySelectorAll('[data-value-for]').forEach(inp => {
    const commit = () => updateLinkValue(inp.dataset.valueFor, inp.value, inp);
    inp.addEventListener('change', commit);
    inp.addEventListener('keydown', e => { if(e.key === 'Enter') inp.blur(); });
  });
  el.querySelectorAll('[data-edit-link]').forEach(elm => elm.addEventListener('click', () => { editingLinkId = elm.dataset.editLink; renderLinkList(); }));
  el.querySelectorAll('[data-up-link]').forEach(b => b.addEventListener('click', () => moveLink(b.dataset.upLink, -1)));
  el.querySelectorAll('[data-down-link]').forEach(b => b.addEventListener('click', () => moveLink(b.dataset.downLink, 1)));
  el.querySelectorAll('[data-del-link]').forEach(b => b.addEventListener('click', () => deleteLink(b.dataset.delLink)));
  el.querySelectorAll('[data-cancel-link]').forEach(b => b.addEventListener('click', () => { editingLinkId = null; renderLinkList(); }));
  el.querySelectorAll('[data-save-link]').forEach(b => {
    const wrap = b.closest('.item');
    const commit = () => {
      const srcSel = wrap.querySelector('.edit-source');
      const tgtSel = wrap.querySelector('.edit-target');
      updateLinkSourceTarget(b.dataset.saveLink, srcSel.value, tgtSel.value);
    };
    b.addEventListener('click', commit);
  });
}

// ---------- Sankey layout + draw ----------
function computeLayout(innerW, innerH, margin){
  const nodeWidth = 16;
  const padding = 14;

  const layer = {};
  nodes.forEach(n => layer[n.id] = 0);
  for(let iter = 0; iter <= nodes.length; iter++){
    let changed = false;
    links.forEach(l => {
      if(layer[l.target] === undefined || layer[l.source] === undefined) return;
      if(layer[l.target] < layer[l.source] + 1){ layer[l.target] = layer[l.source] + 1; changed = true; }
    });
    if(!changed) break;
  }
  const maxLayer = nodes.length ? Math.max(...nodes.map(n => layer[n.id])) : 0;
  const colCount = maxLayer + 1;

  const columns = Array.from({length: colCount}, () => []);
  nodes.forEach(n => columns[layer[n.id]].push(n));

  const inSum = {}, outSum = {};
  nodes.forEach(n => { inSum[n.id] = 0; outSum[n.id] = 0; });
  links.forEach(l => {
    if(outSum[l.source] !== undefined) outSum[l.source] += l.value;
    if(inSum[l.target] !== undefined) inSum[l.target] += l.value;
  });
  const nodeValue = {};
  nodes.forEach(n => { nodeValue[n.id] = Math.max(inSum[n.id], outSum[n.id]); });
  const nonzero = nodes.map(n => nodeValue[n.id]).filter(v => v > 0);
  const baseline = nonzero.length ? Math.max(...nonzero) * 0.12 : 1;
  nodes.forEach(n => { if(nodeValue[n.id] <= 0) nodeValue[n.id] = baseline; });

  let scale = Infinity;
  columns.forEach(col => {
    if(col.length === 0) return;
    const total = col.reduce((s, n) => s + nodeValue[n.id], 0);
    const available = innerH - padding * (col.length - 1);
    if(available <= 0 || total <= 0) return;
    const s = available / total;
    if(s < scale) scale = s;
  });
  if(!isFinite(scale) || scale <= 0) scale = 1;

  const pos = {};
  columns.forEach((col, ci) => {
    const colX = colCount > 1 ? margin.left + ci * ((innerW - nodeWidth) / (colCount - 1)) : margin.left;
    const total = col.reduce((s, n) => s + nodeValue[n.id] * scale, 0) + padding * Math.max(col.length - 1, 0);
    let y = margin.top + (innerH - total) / 2;
    col.forEach(n => {
      const h = Math.max(nodeValue[n.id] * scale, 3);
      pos[n.id] = { x0: colX, x1: colX + nodeWidth, y0: y, y1: y + h };
      y += h + padding;
    });
  });

  return { pos, scale, colCount, nodeValue };
}

function computeLinkOffsets(pos, scale){
  const bySource = {}, byTarget = {};
  links.forEach(l => {
    if(!pos[l.source] || !pos[l.target]) return;
    (bySource[l.source] = bySource[l.source] || []).push(l);
    (byTarget[l.target] = byTarget[l.target] || []).push(l);
  });
  Object.values(bySource).forEach(arr => arr.sort((a,b) => (pos[a.target].y0 - pos[b.target].y0)));
  Object.values(byTarget).forEach(arr => arr.sort((a,b) => (pos[a.source].y0 - pos[b.source].y0)));

  const linkPos = {};
  links.forEach(l => { linkPos[l.id] = { width: Math.max(l.value * scale, 1) }; });

  Object.keys(bySource).forEach(sid => {
    let y = pos[sid].y0;
    bySource[sid].forEach(l => { linkPos[l.id].y0 = y + linkPos[l.id].width/2; y += linkPos[l.id].width; });
  });
  Object.keys(byTarget).forEach(tid => {
    let y = pos[tid].y0;
    byTarget[tid].forEach(l => { linkPos[l.id].y1 = y + linkPos[l.id].width/2; y += linkPos[l.id].width; });
  });
  return linkPos;
}

function drawSankey(){
  const svg = document.getElementById('sankey-svg');
  const emptyState = document.getElementById('empty-state');
  svg.innerHTML = '';

  if(nodes.length === 0){
    emptyState.style.display = 'block';
    return;
  }
  emptyState.style.display = 'none';

  const rect = svg.parentElement.getBoundingClientRect();
  const w = Math.max(rect.width, 320);
  const h = Math.max(rect.height, 320);
  svg.setAttribute('viewBox', `0 0 ${w} ${h}`);

  const margin = { top: 28, right: 150, bottom: 28, left: 150 };
  const innerW = w - margin.left - margin.right;
  const innerH = h - margin.top - margin.bottom;
  if(innerW <= 0 || innerH <= 0) return;

  const { pos, scale, nodeValue } = computeLayout(innerW, innerH, margin);
  const linkPos = computeLinkOffsets(pos, scale);

  const svgns = 'http://www.w3.org/2000/svg';
  const linkGroup = document.createElementNS(svgns, 'g');
  const nodeGroup = document.createElementNS(svgns, 'g');
  const labelGroup = document.createElementNS(svgns, 'g');
  const linkLabelGroup = document.createElementNS(svgns, 'g');

  links.forEach(l => {
    const s = pos[l.source], t = pos[l.target], lp = linkPos[l.id];
    if(!s || !t || !lp) return;
    const x0 = s.x1, x1 = t.x0;
    const midx = (x0 + x1) / 2;
    const y0 = lp.y0, y1 = lp.y1;
    const path = document.createElementNS(svgns, 'path');
    path.setAttribute('d', `M${x0},${y0} C${midx},${y0} ${midx},${y1} ${x1},${y1}`);
    const colorNode = colorMode === 'target' ? nodeById(l.target) : nodeById(l.source);
    path.setAttribute('stroke', nodeColor(colorNode));
    path.setAttribute('stroke-opacity', '0.45');
    path.setAttribute('stroke-width', lp.width);
    path.setAttribute('fill', 'none');
    const title = document.createElementNS(svgns, 'title');
    const sName = nodeById(l.source)?.name || '?';
    const tName = nodeById(l.target)?.name || '?';
    title.textContent = `${sName} → ${tName} : ${formatNum(l.value)}`;
    path.appendChild(title);
    linkGroup.appendChild(path);

    // value label at the midpoint of the link, shown when the ribbon is wide enough
    if(lp.width >= 9){
      const lblY = (y0 + y1) / 2;
      const text = document.createElementNS(svgns, 'text');
      text.setAttribute('x', midx);
      text.setAttribute('y', lblY);
      text.setAttribute('dy', '0.32em');
      text.setAttribute('text-anchor', 'middle');
      text.setAttribute('fill', 'var(--text)');
      text.setAttribute('font-size', '10.5');
      text.setAttribute('font-family', "'IBM Plex Mono', monospace");
      text.setAttribute('paint-order', 'stroke');
      text.setAttribute('stroke', 'var(--bg)');
      text.setAttribute('stroke-width', '3');
      text.textContent = formatNum(l.value);
      linkLabelGroup.appendChild(text);
    }
  });

  nodes.forEach(n => {
    const p = pos[n.id];
    if(!p) return;
    const rectEl = document.createElementNS(svgns, 'rect');
    rectEl.setAttribute('x', p.x0);
    rectEl.setAttribute('y', p.y0);
    rectEl.setAttribute('width', p.x1 - p.x0);
    rectEl.setAttribute('height', Math.max(p.y1 - p.y0, 2));
    rectEl.setAttribute('rx', 2);
    rectEl.setAttribute('fill', nodeColor(n));
    rectEl.setAttribute('stroke', 'var(--border)');
    rectEl.setAttribute('stroke-width', '1');
    const title = document.createElementNS(svgns, 'title');
    title.textContent = `${n.name} : ${formatNum(nodeValue[n.id])}`;
    rectEl.appendChild(title);
    nodeGroup.appendChild(rectEl);

    const label = document.createElementNS(svgns, 'text');
    const cx = (p.x0 + p.x1) / 2;
    const leftHalf = cx < margin.left + innerW / 2;
    label.setAttribute('x', leftHalf ? p.x1 + 8 : p.x0 - 8);
    label.setAttribute('y', (p.y0 + p.y1) / 2);
    label.setAttribute('dy', '0.32em');
    label.setAttribute('text-anchor', leftHalf ? 'start' : 'end');
    label.setAttribute('fill', 'var(--text)');
    label.setAttribute('font-size', '12.5');
    label.setAttribute('font-family', "'Space Grotesk', sans-serif");
    label.textContent = `${n.name} (${formatNum(nodeValue[n.id])})`;
    labelGroup.appendChild(label);
  });

  svg.appendChild(linkGroup);
  svg.appendChild(linkLabelGroup);
  svg.appendChild(nodeGroup);
  svg.appendChild(labelGroup);
}

// ---------- Sample data ----------
function loadSample(){
  nodes = [];
  links = [];
  categoryColors = {};
  nextColorIndex = 0;
  const mk = (name, category) => { const n = { id: uid('n'), name, category }; nodes.push(n); return n.id; };
  const income = mk('収入', '収入');
  const afterTax = mk('税引後所得', '収入');
  const housing = mk('住居費', '支出');
  const food = mk('食費', '支出');
  const saving = mk('貯蓄', '支出');
  const other = mk('その他', '支出');
  const tax = mk('税金', '控除');
  links.push(
    { id: uid('l'), source: income, target: afterTax, value: 70 },
    { id: uid('l'), source: income, target: tax, value: 30 },
    { id: uid('l'), source: afterTax, target: housing, value: 25 },
    { id: uid('l'), source: afterTax, target: food, value: 15 },
    { id: uid('l'), source: afterTax, target: saving, value: 20 },
    { id: uid('l'), source: afterTax, target: other, value: 10 }
  );
  refreshAll();
  autosave();
  showToast('サンプルを読み込みました');
}

// ---------- Export ----------
function exportJson(){
  if(nodes.length === 0){ showToast('書き出すデータがありません'); return; }
  const data = { nodes, links, categoryColors, exportedAt: new Date().toISOString() };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'sankey_data.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('JSONを書き出しました (sankey_backend.py で利用できます)');
}

// ---------- Events ----------
document.getElementById('btn-add-node').addEventListener('click', () => {
  addNode(document.getElementById('node-name').value, document.getElementById('node-category').value, pendingNodeColor);
});
document.getElementById('node-color-custom').addEventListener('input', e => {
  pendingNodeColor = e.target.value;
  renderAddNodeSwatches();
});
document.getElementById('node-color-auto').addEventListener('click', () => {
  pendingNodeColor = null;
  renderAddNodeSwatches();
});
document.getElementById('node-name').addEventListener('keydown', e => { if(e.key === 'Enter') document.getElementById('btn-add-node').click(); });
document.getElementById('node-category').addEventListener('keydown', e => { if(e.key === 'Enter') document.getElementById('btn-add-node').click(); });

document.getElementById('btn-add-link').addEventListener('click', () => {
  addLink(document.getElementById('link-source').value, document.getElementById('link-target').value, document.getElementById('link-value').value);
});
document.getElementById('link-value').addEventListener('keydown', e => { if(e.key === 'Enter') document.getElementById('btn-add-link').click(); });

document.getElementById('color-mode').addEventListener('change', e => { colorMode = e.target.value; drawSankey(); autosave(); });

document.getElementById('btn-save').addEventListener('click', () => saveDiagram(document.getElementById('save-name').value));
document.getElementById('save-name').addEventListener('keydown', e => { if(e.key === 'Enter') document.getElementById('btn-save').click(); });

document.getElementById('btn-open-saved').addEventListener('click', () => {
  const panel = document.getElementById('saved-panel');
  panel.classList.toggle('open');
  if(panel.classList.contains('open')) refreshSavedList();
});

document.getElementById('btn-clear').addEventListener('click', () => {
  if(nodes.length === 0 && links.length === 0) return;
  if(confirm('現在の内容をすべて削除しますか？(保存済みの図は残ります)')){
    nodes = []; links = []; categoryColors = {}; nextColorIndex = 0;
    refreshAll(); autosave();
  }
});

document.getElementById('btn-sample').addEventListener('click', loadSample);
document.getElementById('btn-sample-2').addEventListener('click', loadSample);
document.getElementById('btn-export').addEventListener('click', exportJson);

document.addEventListener('click', e => {
  const panel = document.getElementById('saved-panel');
  if(!panel.contains(e.target) && e.target.id !== 'btn-open-saved' && panel.classList.contains('open')){
    panel.classList.remove('open');
  }
});

let resizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(drawSankey, 120);
});

init();
</script>
